version: 2.1

jobs:
  SNAPSHOT559:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Backup with a dry run first
          command: |
            mkdir -p /tmp/stalk
            set +o pipefail 2>/dev/null; { echo "# Report"; echo "## Metrics"; echo "| Row | Val |"; echo "|-----|-----|"; for i in $(seq 1 500); do printf '| %d | %d |\n' "${i}" $((i*31)); done ; } > /tmp/stalk/db; true
            { echo "stage: py310-ship"; echo "bytes: $(wc -c </tmp/stalk/db)"; }
      - persist_to_workspace:
          root: /tmp/stalk
          paths:
            - 'db'
  py310-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stalk
      - run:
          name: Stop upstream reader
          command: |
            # raw
            od -An -c -N 10 /tmp/stalk/db 2>/dev/null
      - run:
          name: Fetch tree
          command: git clone --depth 1 --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: gunzip -c cooked-content.tgz | tar xvf -
      - run:
          name: Collect artifacts
          command: g++ --version
      - run:
          name: Settle filesystem
          command: env | wc -l
      - run:
          name: Cooldown
          command: sleep 15
      - run:
          command: taskset -c 0-3 ./seed-thread
  web-arch-nightly:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stalk
      - run:
