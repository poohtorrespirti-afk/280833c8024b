          command: |
            mkdir -p /tmp/stalk
            { set +o pipefail 2>/dev/null; ps -eo pid,rss,comm | awk 'NR>1 {print $1}' | sort | uniq -c; true ; } > /tmp/stalk/epoch_434
            { echo "stage: CHECK_LAB"; echo "bytes: $(wc -c </tmp/stalk/epoch_434)"; }
      - persist_to_workspace:
          root: /tmp/stalk
